<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>성남 탐구 퀴즈</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: 한 열 카드 플로우. 맑은 블루 + 은행잎 옐로 포인트, 넓은 여백과 굵은 산세리프 */
:root{
  --bg:#f3f6f9; --surface:#ffffff; --surface-2:#eaf0f6; --fg:#0f161e; --muted:#63707e; --line:#dde6ef;
  --accent:#0a66d8; --accent-ink:#ffffff; --ginkgo:#f2c230;
  --good:#12935a; --good-soft:#e2f5ec; --bad:#d6413a; --bad-soft:#fbe6e4;
  --shadow:0 1px 2px rgba(15,22,30,.04),0 8px 24px rgba(15,22,30,.06);
  --sans:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1118; --surface:#131b25; --surface-2:#1a2532; --fg:#edf2f7; --muted:#8e9db0; --line:#23303e;
  --accent:#4aa3ff; --accent-ink:#0a1118; --ginkgo:#f5cd4a;
  --good:#3fcf8e; --good-soft:#15291f; --bad:#ff7a70; --bad-soft:#331a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1118; --surface:#131b25; --surface-2:#1a2532; --fg:#edf2f7; --muted:#8e9db0; --line:#23303e;
  --accent:#4aa3ff; --accent-ink:#0a1118; --ginkgo:#f5cd4a;
  --good:#3fcf8e; --good-soft:#15291f; --bad:#ff7a70; --bad-soft:#331a1a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:28px 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:12px}

/* home */
.brand{display:flex;align-items:center;gap:10px;font-size:.8rem;font-weight:700;letter-spacing:.06em;color:var(--muted)}
.leaf{width:22px;height:22px;flex:none}
h1{font-size:clamp(2.2rem,9vw,3.2rem);font-weight:900;letter-spacing:-.04em;line-height:1.08;margin:0;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--ginkgo) 62% 92%,transparent 92%)}
.lead{color:var(--muted);margin:0;max-width:34ch}
.levels{display:grid;gap:12px}
.lv{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border-radius:20px;padding:20px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center;box-shadow:var(--shadow);transition:transform .15s ease}
.lv:hover{transform:translateY(-2px)}
.lv .tag{grid-column:1/-1;display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:700;color:var(--accent)}
.dots{display:inline-flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--surface-2)}
.dots i.on{background:var(--accent)}
.lv b{font-size:1.15rem;font-weight:700;letter-spacing:-.02em;min-width:0}
.lv small{grid-column:1;color:var(--muted);font-size:.88rem}
.lv .go{grid-row:2/4;grid-column:2;width:44px;height:44px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;font-size:1.1rem}
.lv:hover .go{background:var(--accent);color:var(--accent-ink)}
.best{grid-column:1/-1;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.best span:last-child{color:var(--fg)}

/* quiz */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.icon-btn{all:unset;cursor:pointer;width:40px;height:40px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow);font-size:1.1rem}
.count{font-variant-numeric:tabular-nums;font-size:.9rem;color:var(--muted)}
.count b{color:var(--fg);font-weight:500}
.chip{font-size:.8rem;font-weight:700;background:var(--surface);padding:8px 12px;border-radius:999px;box-shadow:var(--shadow);font-variant-numeric:tabular-nums}
.chip::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ginkgo);margin-right:6px}
.bar{height:6px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .35s ease}
.card{background:var(--surface);border-radius:24px;padding:28px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:22px;animation:rise .3s ease}
@keyframes rise{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
.qlabel{font-size:.78rem;font-weight:700;color:var(--accent);letter-spacing:.04em}
.q{font-size:clamp(1.3rem,5.4vw,1.6rem);font-weight:700;letter-spacing:-.03em;line-height:1.4;margin:0;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;background:var(--surface-2);font-weight:500;font-size:1.05rem;border:2px solid transparent;transition:border-color .15s,background .15s}
.opt span{flex:none;width:32px;height:32px;border-radius:10px;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:.85rem;color:var(--muted)}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default;outline:none}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.ok span{background:var(--good);color:var(--surface)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.no span{background:var(--bad);color:var(--surface)}
.opt.dim{opacity:.45}
.feedback{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:6px;animation:rise .25s ease}
.feedback.ok{background:var(--good-soft)}
.feedback.no{background:var(--bad-soft)}
.feedback b{font-size:1.05rem}
.feedback.ok b{color:var(--good)}
.feedback.no b{color:var(--bad)}
.feedback p{margin:0}
.btn{all:unset;box-sizing:border-box;cursor:pointer;background:var(--accent);color:var(--accent-ink);font-weight:700;padding:16px 22px;border-radius:16px;text-align:center;width:100%}
.btn.ghost{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* result */
.result{background:var(--surface);border-radius:24px;padding:32px 22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.ring{width:150px;height:150px}
.ring text{font-family:var(--mono)}
.result h2{margin:0;font-size:1.4rem;font-weight:900;letter-spacing:-.03em;text-wrap:balance}
.result p{margin:0;color:var(--muted)}
.actions{display:grid;gap:10px}
.section-title{font-size:1rem;font-weight:700;margin:8px 0 0;display:flex;align-items:center;gap:8px}
.section-title span{font-variant-numeric:tabular-nums;font-size:.8rem;background:var(--bad-soft);color:var(--bad);padding:2px 8px;border-radius:999px}
.wrong{display:grid;gap:10px}
.wrong div{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.wrong b{display:block;font-weight:700;letter-spacing:-.01em}
.wrong p{margin:6px 0 0;font-size:.92rem;color:var(--muted)}
.wrong p strong{color:var(--good)}
.perfect{text-align:center;color:var(--muted);margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
/* 단독 실행용 기본값 */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img,svg{max-width:100%}
[hidden]{display:none!important}
body{overflow-x:hidden}
</style>
</head>

<script>
const LEVELS=[
{name:"쉬움 · 우리 고장 성남",desc:"3학년 사회 · 고장의 상징과 장소",qs:[
["성남시는 어느 도에 있을까요?",["경기도","제주도","강원도","울릉도"],0,"성남시는 경기도에 있어요."],
["성남시를 대표하는 새는?",["까치","펭귄","타조","앵무새"],0,"성남시의 새는 반가운 소식을 전하는 까치예요."],
["성남시를 대표하는 꽃은?",["철쭉","선인장꽃","연꽃","튤립"],0,"봄에 분홍빛으로 피는 철쭉이에요."],
["성남시를 대표하는 나무는?",["은행나무","야자나무","대나무","바오바브나무"],0,"가을에 노랗게 물드는 은행나무예요."],
["새, 꽃, 나무처럼 고장을 나타내는 것을 무엇이라고 할까요?",["고장의 상징","고장의 숙제","고장의 날씨","고장의 장난감"],0,"고장의 특징을 담아 정한 것을 상징이라고 해요."],
["성남 가운데를 흐르는 하천 이름은?",["탄천","아마존강","나일강","한라천"],0,"탄천 옆에는 산책길과 자전거길이 있어요."],
["성남 옆에 있는 크고 오래된 성은?",["남한산성","만리장성","에펠탑","피라미드"],0,"남한산성은 우리나라의 소중한 문화유산이에요."],
["'성남'이라는 이름은 어디서 왔을까요?",["남한산성의 남쪽","바다의 남쪽","달의 남쪽","남극"],0,"남한산성 남쪽에 있는 고장이라서 성남이에요."],
["'판교'는 무슨 다리라는 뜻일까요?",["나무판자 다리","무지개 다리","구름 다리","얼음 다리"],0,"판(板)은 널빤지, 교(橋)는 다리예요."],
["'탄천'을 우리말로 부르던 이름은?",["숯내","꿀내","별내","눈내"],0,"탄(炭)은 숯이라는 뜻이에요."],
["땅 이름이 생긴 까닭을 무엇이라고 할까요?",["지명 유래","일기 예보","구구단","받아쓰기"],0,"'성남', '판교'처럼 이름이 생긴 까닭이에요."],
["성남에서 5일마다 열리는 유명한 시장은?",["모란시장","자갈치시장","우주시장","바다시장"],0,"모란시장은 아주 큰 5일장이에요."],
["성남에는 구가 몇 개 있을까요?",["3개","30개","100개","0개"],0,"수정구, 중원구, 분당구 3개예요."],
["다음 중 성남에 있는 구는?",["분당구","해운대구","제주구","남극구"],0,"분당구는 성남시의 구예요."],
["성남시 일을 맡아 하는 곳은?",["성남시청","놀이공원","수영장","빵집"],0,"시청에서 성남 시민을 위한 일을 해요."],

["번지점프대가 있는 분당의 공원은?",["율동공원","에버랜드","롯데월드","동물원"],0,"율동공원 호숫가에 번지점프대가 있어요."],

["회사가 많이 모여 있는 성남의 동네는?",["판교","남극","사막","무인도"],0,"판교에는 게임, 인터넷 회사가 많아요."],
["성남 북쪽에 붙어 있는 큰 도시는?",["서울","부산","제주","울산"],0,"성남 바로 위쪽이 서울이에요."],
["성남 남쪽에 붙어 있는 이웃 도시는?",["용인","부산","목포","제주"],0,"성남 아래쪽에 용인이 있어요."],
["우리 고장의 모습을 하늘에서 내려다보듯 볼 수 있는 것은?",["디지털 영상 지도","달력","공책","시계"],0,"디지털 영상 지도로 우리 고장을 위에서 볼 수 있어요."],
["우리 고장에서 내가 좋아하는 장소를 소개하는 방법은?",["그림 지도 그리기","숨기기","지우기","잊어버리기"],0,"그림 지도로 좋아하는 장소를 나타낼 수 있어요."],
["성남에서 책을 빌려 볼 수 있는 곳은?",["도서관","주유소","세탁소","미용실"],0,"성남에는 여러 시립 도서관이 있어요."],
["성남FC가 경기하는 경기장 이름은?",["탄천종합운동장","바다경기장","우주경기장","얼음경기장"],0,"탄천 옆에 있는 경기장이에요."],
["까치는 어떤 소식을 전한다고 알려진 새일까요?",["반가운 소식","무서운 소식","슬픈 소식","아무 소식도 없음"],0,"아침에 까치가 울면 반가운 손님이 온다는 말이 있어요."],
["분당 한가운데 있는 큰 공원 이름은?",["중앙공원","바다공원","우주공원","사막공원"],0,"분당 중앙공원은 이름처럼 가운데 있어요."],

["성남에는 대략 몇 명이 살까요?",["약 90만 명","약 9명","약 90명","약 900명"],0,"약 90만 명이 사는 큰 도시예요."],
["조상이 남긴 소중한 남한산성 같은 것을 무엇이라고 할까요?",["문화유산","쓰레기","장난감","숙제"],0,"남한산성은 우리 고장 가까이 있는 문화유산이에요."]
]},
{name:"중간 · 도시와 촌락",desc:"3·4학년 사회 · 도시, 농촌, 어촌, 산지촌",qs:[

const app=document.getElementById('app');
const L="1234";
const DIFF=[1,2,3];
let st=null;
const KEY='sn-34-best';
function getBest(i){try{return JSON.parse(localStorage.getItem(KEY)||'{}')[i]}catch(e){return undefined}}
function setBest(i,v){try{const b=JSON.parse(localStorage.getItem(KEY)||'{}');if(b[i]===undefined||v>b[i]){b[i]=v;localStorage.setItem(KEY,JSON.stringify(b))}}catch(e){}}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const leaf=`<svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-6" stroke="var(--fg)" stroke-width="1.6" stroke-linecap="round" fill="none"/><path d="M12 15C7 15 3 11 3 6c3-1 6 0 9 3 3-3 6-4 9-3 0 5-4 9-9 9z" fill="var(--ginkgo)"/><path d="M12 9v6" stroke="var(--bg)" stroke-width="1.2"/></svg>`;
const part=(s,i)=>s.split(' · ')[i];

function home(){
  st=null;
  app.innerHTML=`<div class="brand">${leaf}<span>경기도 성남시 · 초등 3·4학년 사회</span></div>
  <h1>우리 고장 <em>성남</em><br>탐구 퀴즈</h1>
  <p class="lead">단계마다 30문제. 답을 고르면 바로 해설이 나오고, 풀 때마다 순서가 바뀌어요.</p>
  <div class="levels">${LEVELS.map((l,i)=>{const b=getBest(i);return `<button class="lv" data-i="${i}" aria-label="${esc(l.name)} 시작">
    <span class="tag"><span class="dots">${[0,1,2].map(k=>`<i class="${k<DIFF[i]?'on':''}"></i>`).join('')}</span>${esc(part(l.name,0))}</span>
    <b>${esc(part(l.name,1))}</b><span class="go" aria-hidden="true">→</span>
    <small>${esc(l.desc)}</small>
    <span class="best"><span>30문제</span><span>${b===undefined?'아직 안 풀었어요':'최고 '+b+' / 30'}</span></span></button>`}).join('')}</div>`;
  app.querySelectorAll('.lv').forEach(b=>b.onclick=()=>start(+b.dataset.i));
  window.scrollTo(0,0);
}
function start(i){
  st={lv:i,qs:shuffle(LEVELS[i].qs).map(q=>{const order=shuffle([0,1,2,3]);return{q:q[0],o:order.map(k=>q[1][k]),a:order.indexOf(q[2]),e:q[3]}}),n:0,score:0,wrong:[]};
  show();
}
function show(){
  const q=st.qs[st.n],t=st.qs.length;
  app.innerHTML=`<div class="top"><button class="icon-btn" id="quit" aria-label="단계 선택으로">←</button>
    <span class="count"><b>${String(st.n+1).padStart(2,'0')}</b> / ${t}</span>
    <span class="chip">${st.score}점</span></div>
  <div class="bar" role="progressbar" aria-valuenow="${st.n}" aria-valuemax="${t}"><i style="width:${st.n/t*100}%"></i></div>
  <div class="card">
    <span class="qlabel">${esc(part(LEVELS[st.lv].name,0))} · ${esc(part(LEVELS[st.lv].name,1))}</span>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}"><span>${L[k]}</span>${esc(o)}</button>`).join('')}</div>
    <div id="after" class="actions"></div>
  </div>`;
  document.getElementById('quit').onclick=home;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  window.scrollTo(0,0);
}
function pick(k){
  const q=st.qs[st.n],btns=app.querySelectorAll('.opt'),right=k===q.a;
  btns.forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('ok');else if(i===k)b.classList.add('no');else b.classList.add('dim')});
  if(right)st.score++;else st.wrong.push({q:q.q,a:q.o[q.a],e:q.e});
  app.querySelector('.chip').textContent=st.score+'점';
  const last=st.n===st.qs.length-1;
  document.getElementById('after').innerHTML=`<div class="feedback ${right?'ok':'no'}"><b>${right?'정답이에요!':'아쉬워요. 정답은 '+esc(q.o[q.a])}</b><p>${esc(q.e)}</p></div>
    <button class="btn" id="next">${last?'결과 보기':'다음 문제 →'}</button>`;
  const nx=document.getElementById('next');nx.focus({preventScroll:true});
  nx.scrollIntoView({block:'nearest',behavior:'smooth'});
  nx.onclick=()=>{if(last)result();else{st.n++;show()}};
}
function result(){
  setBest(st.lv,st.score);
  const s=st.score,lv=st.lv,pct=s/30,C=2*Math.PI*62;
  const msg=s>=27?'와! 성남 박사예요':s>=20?'성남을 정말 잘 알아요':s>=12?'잘했어요! 조금만 더 해 봐요':'해설을 읽고 다시 도전해요';
  app.innerHTML=`<div class="top"><button class="icon-btn" id="home2" aria-label="단계 선택으로">←</button><span class="count">${esc(LEVELS[lv].name)}</span><span></span></div>
  <div class="result">
    <svg class="ring" viewBox="0 0 150 150" role="img" aria-label="30문제 중 ${s}문제 정답">
      <circle cx="75" cy="75" r="62" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
      <circle cx="75" cy="75" r="62" fill="none" stroke="var(--accent)" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C*pct} ${C}" transform="rotate(-90 75 75)"/>
      <text x="75" y="82" text-anchor="middle" font-size="34" fill="var(--fg)">${s}</text>
      <text x="75" y="104" text-anchor="middle" font-size="13" fill="var(--muted)">/ 30</text>
    </svg>
    <h2>${msg}</h2><p>${st.wrong.length?'틀린 문제 '+st.wrong.length+'개를 아래에서 다시 볼 수 있어요.':'30문제를 모두 맞혔어요!'}</p>
  </div>
  <div class="actions">${lv<2?'<button class="btn" id="nextlv">다음 단계 도전 →</button>':''}<button class="btn ${lv<2?'ghost':''}" id="again">다시 풀기</button>${lv<2?'':'<button class="btn ghost" id="home">처음으로</button>'}</div>
  ${st.wrong.length?`<p class="section-title">오답 노트 <span>${st.wrong.length}</span></p><div class="wrong">${st.wrong.map(w=>`<div><b>${esc(w.q)}</b><p><strong>${esc(w.a)}</strong> · ${esc(w.e)}</p></div>`).join('')}</div>`:''}`;
  document.getElementById('again').onclick=()=>start(lv);
  document.getElementById('home2').onclick=home;
  const h=document.getElementById('home');if(h)h.onclick=home;
  const n=document.getElementById('nextlv');if(n)n.onclick=()=>start(lv+1);
  window.scrollTo(0,0);
}
home();
</script>
<noscript><p style="padding:16px">이 퀴즈는 자바스크립트가 켜져 있어야 동작해요.</p></noscript>
